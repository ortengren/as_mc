[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asmcmc"
version = "0.1.0"
description = "AniSOAP Markov Chain Monte Carlo: NPT/NVT ensemble MC for ellipsoidal coarse-grained molecules (Gay-Berne + quadrupole), built on ASE"
requires-python = ">=3.11"
dependencies = [
    "ase",
    "numpy>=2.0",   # np.vecdot
    "scipy",
    "pandas",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
# AniSOAP descriptors and the ridge Delta-model (asmcmc.delta_learning)
anisoap = [
    "anisoap",
    "metatensor",
    "scikit-learn",
]
# UMA labels (asmcmc.delta_learning.dataset, scripts/uma_cacelli_dimers.py)
uma = ["fairchem-core"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["asmcmc*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
